<!DOCTYPE html>
<html>
<body>
  <h2>Socket.IO 알림 테스트</h2>
  <pre id="log"></pre>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // 서버 주소와 포트에 맞게 수정
    /*
      쿠키, 세션, 인증헤더 사용 시 withCredentials: true 추가
      예시: const socket = io("http://localhost:3000", { withCredentials: true });
      주의: origin에 "*" 와일드 카드 사용 불가
    */ 
    const socket = io("http://localhost:3000", {}); 

    socket.on("connect", () => {
      document.getElementById('log').textContent += "소켓 연결됨\n";
      // 여기에 userId를 실제 로그인한 사용자 id로 바꿔서 join 이벤트 전송
      socket.emit("join", 1); // 예시: 1번 유저로 join
    });

    socket.on("notification", (data) => {
      document.getElementById('log').textContent += "알림: " + JSON.stringify(data) + "\n";
    });

    socket.on("disconnect", () => {
      document.getElementById('log').textContent += "소켓 연결 해제됨\n";
    });
  </script>
</body>
</html>
