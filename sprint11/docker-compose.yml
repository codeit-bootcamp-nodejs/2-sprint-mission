version: "3.9"

services:
  api:
    build: .
    ports:
      - "3000:3000" 
    volumes:
      - ./uploads:/app/uploads # 업로드 파일 유지
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mydb

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - db_data:/var/lib/postgresql/data # DB 데이터 유지

volumes:
  db_data:
