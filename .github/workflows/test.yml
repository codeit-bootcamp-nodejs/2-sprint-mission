name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - "**"   # 모든 브랜치에서 PR이 열리면 실행

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
